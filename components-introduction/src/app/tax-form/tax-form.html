<!-- LEFT COLUMN: Add Item Form (4 cols) -->
<div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 flex flex-col justify-between">
    <div>
        <h3 class="text-lg font-bold text-slate-800 mb-6 pb-3 border-b border-slate-100">Agregar Nuevo Ítem</h3>

        <form id="item-form" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Descripción del
                    Ítem</label>
                <input type="text" id="item-desc" placeholder="Ej. Notebook Importada"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm outline-none transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Valor Base
                    (ARS)</label>
                <input type="number" id="item-base" required min="1" step="any" placeholder="150000"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm outline-none transition">
            </div>

            <div>
                <label
                    class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Categoría</label>
                <select id="item-category" required onchange="updateTaxPreview()"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm bg-white outline-none transition cursor-pointer">
                    <option value="" disabled selected>Seleccione una categoría</option>
                    <option value="Electrónica" data-rate="0.305">Electrónica (30.5%)</option>
                    <option value="Libros" data-rate="0.0">Libros (0%)</option>
                    <option value="Alimentos Básicos" data-rate="0.105">Alimentos Básicos (10.5%)</option>
                    <option value="Indumentaria" data-rate="0.21">Indumentaria (21.0%)</option>
                    <option value="Servicios Digitales" data-rate="45.0" data-rate-val="0.45">Servicios Digitales
                        (45.0%)</option>
                </select>
            </div>

            <div id="tax-preview-box"
                class="p-3 bg-blue-50 rounded-xl border border-blue-100 text-xs text-blue-700 hidden">
                <span class="font-semibold">Tasa aplicada:</span> <span id="preview-rate-text">0%</span>
            </div>

            <button
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center space-x-2 text-sm">
                <i class="fa-solid fa-plus"></i>
                <span>Agregar Ítem</span>
            </button>
        </form>
    </div>

    <div class="mt-8 pt-4 border-t border-slate-100 text-xs text-slate-400 flex items-center justify-between">
        <span>Cálculos automáticos AFIP</span>
        <i class="fa-solid fa-shield-halved text-emerald-500"></i>
    </div>
</div>
