<div class="min-h-screen flex flex-col md:flex-row">
    <!-- Notification Message Box (Custom modal instead of alert) -->
    <div id="toast"
        class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-xl flex items-center space-x-3">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toast-message" class="text-sm font-medium">Acción realizada con éxito</span>
    </div>

    <!-- SIDEBAR -->
    <aside class="w-full md:w-64 bg-[#141e33] text-white flex flex-col justify-between shrink-0 shadow-lg">
        <div>
            <!-- Sidebar Header / Logo -->
            <div class="p-5 flex items-center space-x-3 border-b border-slate-700/50">
                <div class="bg-blue-600 p-2.5 rounded-xl text-white shadow-md flex items-center justify-center">
                    <i class="fa-solid fa-calculator text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight">Calculadora de</h1>
                    <h2 class="font-bold text-base leading-tight">Impuestos</h2>
                    <span class="text-xs text-blue-400 font-medium">Argentina</span>
                </div>
            </div>

            <!-- Navigation Links -->
            <nav class="p-4 space-y-1.5">
                <a href="#" onclick="switchTab('inicio')" id="nav-inicio"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800/60 transition font-medium text-sm">
                    <i class="fa-solid fa-house w-5"></i>
                    <span>Inicio</span>
                </a>
                <a href="#" onclick="switchTab('calculadora')" id="nav-calculadora"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-[#25395c] text-white transition font-medium text-sm shadow-sm">
                    <i class="fa-solid fa-calculator w-5 text-blue-400"></i>
                    <span>Calculadora</span>
                </a>
                <a href="#" onclick="switchTab('historial')" id="nav-historial"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800/60 transition font-medium text-sm">
                    <i class="fa-solid fa-clock-rotate-left w-5"></i>
                    <span>Historial</span>
                </a>
                <a href="#" onclick="switchTab('configuracion')" id="nav-configuracion"
                    class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800/60 transition font-medium text-sm">
                    <i class="fa-solid fa-gear w-5"></i>
                    <span>Configuración</span>
                </a>
            </nav>
        </div>

        <!-- Sidebar Footer -->
        <div class="p-4 border-t border-slate-700/50 text-xs text-slate-400 text-center">
            v2.4 - AFIP & Tasas Provinciales
        </div>
    </aside>

    <!-- MAIN CONTENT CONTAINER -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

        <!-- TOP NAVBAR -->
        <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 shadow-xs">
            <div class="flex items-center space-x-3">
                <span
                    class="text-xs font-semibold px-2.5 py-1 bg-blue-50 text-blue-700 rounded-full border border-blue-200 uppercase tracking-wider">Período
                    Fiscal 2026</span>
            </div>

            <div class="flex items-center space-x-4">
                <!-- Theme toggle button -->
                <button onclick="toggleTheme()"
                    class="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 transition focus:outline-none">
                    <i id="theme-icon" class="fa-solid fa-sun text-amber-500"></i>
                </button>

                <!-- User Profile -->
                <div class="flex items-center space-x-3 pl-2 border-l border-slate-200">
                    <div
                        class="w-9 h-9 rounded-full bg-blue-600 text-white font-semibold flex items-center justify-center shadow-sm">
                        LL
                    </div>
                    <div class="hidden sm:block text-left">
                        <div class="text-sm font-semibold text-slate-800 flex items-center space-x-1.5">
                            <span>Lautaro López</span>
                            <i class="fa-solid fa-chevron-down text-xs text-slate-400"></i>
                        </div>
                        <div class="text-xs text-slate-500">Contribuyente</div>
                    </div>
                </div>
            </div>
        </header>

        <!-- DASHBOARD VIEW -->
        <main class="flex-1 overflow-y-auto p-6 lg:p-8">

            <!-- Main Title -->
            <div class="flex items-center space-x-3 mb-8">
                <div class="bg-blue-600 text-white p-2 rounded-lg shadow-sm">
                    <i class="fa-solid fa-calculator text-lg"></i>
                </div>
                <h2 class="text-xl lg:text-2xl font-bold text-slate-800">Calculadora de Impuestos por Ítems (Argentina)
                </h2>
            </div>

            <!-- Two Columns Layout -->
            <div class="grid grid-cols-1 xl:grid-cols-12 gap-8">

                <!-- LEFT COLUMN: Add Item Form (4 cols) -->
                <div
                    class="xl:col-span-4 bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 flex flex-col justify-between">
                    <app-tax-form (item)="onItemAdded($event)"></app-tax-form>
                </div>

                <!-- RIGHT COLUMN: Table and Totals (8 cols) -->
                <div class="xl:col-span-8 space-y-6">
                    
                    <!-- Table Card -->
                    <app-tax-list [items]="items"></app-tax-list>

                    <!-- Totals Summary Card -->
                    <app-tax-total [items]="items"></app-tax-total>

                </div>

            </div>

        </main>
    </div>
</div>
